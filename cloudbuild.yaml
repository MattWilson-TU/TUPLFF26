steps:
  # Build the container image
  # Use $BUILD_ID for a unique tag so this works even when COMMIT_SHA is empty
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'build',
      '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/web-app:$BUILD_ID',
      '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/web-app:latest',
      '.'
    ]

  # Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/web-app:$BUILD_ID'
    ]

  - name: 'gcr.io/cloud-builders/docker'
    args: [
      'push',
      'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/web-app:latest'
    ]

  # Deploy container image to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args: [
      'run', 'deploy', 'web-app',
      '--image', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/web-app:$BUILD_ID',
      '--region', 'europe-west1',
      '--platform', 'managed',
      '--allow-unauthenticated',
      '--port', '3000',
      '--memory', '256Mi',
      '--cpu', '0.5',
      '--max-instances', '10',
      '--update-env-vars', 'NODE_ENV=production',
      '--update-env-vars', 'NEXTAUTH_URL=https://app.tuplff.co.uk',
      '--update-env-vars', 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID',
      '--update-env-vars', 'DATABASE_URL=${_DATABASE_URL}',
      # Live auction log Google Sheet (override via substitutions if needed)
      '--update-env-vars', 'AUCTION_LOG_SHEET_ID=${_AUCTION_LOG_SHEET_ID}',
      '--update-env-vars', 'AUCTION_LOG_SHEET_TAB=${_AUCTION_LOG_SHEET_TAB}',
      '--update-env-vars', 'NEXT_PUBLIC_AUCTION_LOG_SHEET_URL=${_AUCTION_LOG_SHEET_URL}',
      '--add-cloudsql-instances', 'tuplff25-26:europe-west2:fpl-auction-db'
    ]

options:
  logging: CLOUD_LOGGING_ONLY
  substitution_option: 'ALLOW_LOOSE'

substitutions:
  # Socket-based DATABASE_URL template for Cloud SQL (override when building to avoid committing secrets)
  # Example:
  #   gcloud builds submit --config cloudbuild.yaml \
  #     --substitutions=_DATABASE_URL="postgresql://fpluser:Simple123@localhost:5432/fpl_auction?host=/cloudsql/tuplff25-26:europe-west2:fpl-auction-db"
  _DATABASE_URL: 'postgresql://fpluser:Simple123@localhost:5432/fpl_auction?host=/cloudsql/tuplff25-26:europe-west2:fpl-auction-db'
  # Set these after creating the auction log Google Sheet and sharing it with the Cloud Run SA
  _AUCTION_LOG_SHEET_ID: ''
  _AUCTION_LOG_SHEET_TAB: 'Auction Log'
  _AUCTION_LOG_SHEET_URL: ''
